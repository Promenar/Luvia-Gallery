services:
  api:
    build:
      context: .
    image: luvia-gallery-v2:local
    command: ["node", "src/api/main.ts"]
    ports:
      - "3000:3001"
    environment:
      DATA_DIR: /data
      CACHE_DIR: /cache
      MEDIA_ROOT: /media
      TZ: ${TZ:-Asia/Shanghai}
      LUVIA_HOST_PATHS: "${LUVIA_HOST_PATHS:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      # 部署在反向代理后时取消注释并填可信代理跳数（一层代理为 1），否则登录限速按代理地址对全站生效
      # TRUST_PROXY: "1"
      # 只通过纯 HTTP 在内网访问时取消注释，否则生产模式下浏览器不会保存登录 Cookie
      # COOKIE_SECURE: "false"
    volumes:
      - luvia-data:/data
      - luvia-cache:/cache
      - "${LUVIA_MEDIA_PATH:-./media}:/media:ro"
    restart: unless-stopped

  worker:
    build:
      context: .
    image: luvia-gallery-v2:local
    command: ["node", "src/worker/main.ts"]
    environment:
      DATA_DIR: /data
      CACHE_DIR: /cache
      MEDIA_ROOT: /media
      TZ: ${TZ:-Asia/Shanghai}
      LUVIA_HOST_PATHS: "${LUVIA_HOST_PATHS:-}"
    volumes:
      - luvia-data:/data
      - luvia-cache:/cache
      - "${LUVIA_MEDIA_PATH:-./media}:/media:ro"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "try { const D=require('better-sqlite3'); const db=new D(process.env.DATA_DIR+'/luvia.db',{readonly:true,fileMustExist:true}); const row=db.prepare(\"SELECT value FROM settings WHERE key='worker.heartbeat'\").get(); const h=JSON.parse(row.value); db.close(); process.exit(h.healthy && Date.now()/1000-h.at<20 ? 0 : 1); } catch { process.exit(1); }"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # 需要 NVIDIA 容器运行时和 GPU 时，启用以下设备预留，并在 worker 的 environment 中加入
    # NVIDIA_DRIVER_CAPABILITIES: "compute,video,utility"（缺少 video 时 NVENC 不可用，自动回退 CPU 编码）。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  luvia-data:
  luvia-cache:
