  function regionListMarkup() {
    var s = state.single;
    if (s.phase === 'detecting') {
      return '<div class="region-list"><div class="hint">正在分析画面，请稍候…</div></div>';
    }
    if (s.phase === 'empty') {
      return '<div class="region-list"><div class="hint">当前阈值 <strong>' + s.threshold + '</strong> 下没有区域超过阈值。可降低阈值再试。</div></div>';
    }
    if (s.phase === 'repairing' || s.phase === 'done') {
      return '<div class="region-list"><div class="hint">已处理 <strong>' + activeRegions().length + '</strong> 处区域 · 蒙版只用于生成副本。</div></div>';
    }
    if (s.phase === 'cancelled') {
      return '<div class="region-list"><div class="hint">任务已取消，没有修改任何图片。</div></div>';
    }
    return '<div class="region-list">' + s.regions.map(function (region) {
      var below = Math.round(region.score * 255) < s.threshold;
      return '<label class="region' + (below ? ' is-below' : '') + '">' +
        '<input type="checkbox" data-change="region" data-id="' + region.id + '"' + (region.on && !below ? ' checked' : '') + (below ? ' disabled' : '') + '>' +
        '<span class="region-main"><b>' + esc(region.label) + '</b><small>' + (below ? '低于当前阈值' : '已加入修复区域') + '</small></span>' +
        '<span class="region-score">' + region.score.toFixed(2) + '</span>' +
      '</label>';
    }).join('') +
    '<p class="region-note">数字为检测分数（区域模型概率均值），仅用于排序参考，尚未验证准确率。</p>' +
    '</div>';
  }

  function taskCard() {
    var s = state.single;
    var body = '';
    var sub = '单图任务只在当前会话中运行';
    var pill = '';

    if (s.phase === 'detected') {
      pill = '<span class="pill muted">未开始</span>';
      body = '<div class="status-line"><i class="live" style="--tone:var(--ok)"></i>准备就绪，等待开始</div>' +
        '<p class="hint">预计 8–12 秒 · 生成 1 个副本预览，不写入原图。</p>' + stepsMarkup();
    } else if (s.phase === 'stale') {
      pill = '<span class="pill warn">待检测</span>';
      body = '<div class="status-line">阈值改为 ' + s.threshold + '，需要重新检测后才能修复。</div>' + stepsMarkup();
    } else if (s.phase === 'detecting') {
      sub = '正在生成检测蒙版';
      pill = '<span class="pill accent"><i class="live"></i>进行中</span>';
      body = '<div class="prog-head"><span>正在分析画面</span><b>…</b></div>' +
        '<div class="bar indeterminate"><i></i></div>' + stepsMarkup() +
        '<div class="btn-row"><button type="button" class="btn sm danger" data-action="single-cancel">' + icon('x') + '取消检测</button></div>';
    } else if (s.phase === 'repairing') {
      sub = '正在重建蒙版区域';
      pill = '<span class="pill accent"><i class="live"></i>修复中</span>';
      body = '<div class="prog-head"><span data-single-status>正在生成蒙版…</span><b data-single-pct>' + Math.round(s.progress) + '%</b></div>' +
        '<div class="bar"><i data-single-bar style="width:' + Math.round(s.progress) + '%"></i></div>' +
        stepsMarkup() +
        '<div class="btn-row"><button type="button" class="btn sm danger" data-action="single-cancel">' + icon('x') + '取消修复</button></div>';
    } else if (s.phase === 'done') {
      sub = '可对比并保存副本';
      pill = '<span class="pill ok">完成</span>';
      body = '<div class="done-line"><span class="ok-ring">' + icon('check') + '</span><div><b>修复完成 · 用时 6.4 秒</b><small>已处理 ' + activeRegions().length + ' 处区域，原图未改动</small></div></div>' +
        '<p class="hint">拖动画面分割线对比；确认后保存为新的图片副本。</p>';
    } else if (s.phase === 'empty') {
      sub = '当前阈值下未检出';
      pill = '<span class="pill muted">未检出</span>';
      body = '<div class="status-line">阈值 ' + s.threshold + ' 下没有区域超过阈值，未生成副本。</div>' +
        '<p class="hint">水印颜色较淡时可降低阈值；提高阈值则更保守。</p>';
    } else {
      sub = '任务已取消';
      pill = '<span class="pill muted">已取消</span>';
      body = '<div class="status-line">已取消，未生成任何副本。</div>' +
        '<div class="btn-row"><button type="button" class="btn sm" data-action="single-reset">' + icon('refresh') + '重新开始</button></div>';
    }

    return '<section class="card">' +
      '<div class="card-head"><div><h2>任务</h2><p>' + sub + '</p></div>' + pill + '</div>' +
      '<div class="card-body">' + body + '</div>' +
    '</section>';
  }

  function stepsMarkup() {
    var s = state.single;
    var active = -1;
    if (s.phase === 'detecting') active = 0;
    else if (s.phase === 'repairing') active = s.progress < 45 ? 1 : s.progress < 84 ? 2 : 3;
    var complete = s.phase === 'done';
    var labels = ['检测', '蒙版', '修复', '合成'];
    return '<div class="steps' + (complete ? ' all-done' : '') + '">' + labels.map(function (label, index) {
      var cls = complete || index < active ? ' is-done' : index === active ? ' is-active' : '';
      return '<span class="step' + cls + '" data-step="' + index + '">' + label + '</span>';
    }).join('') + '</div>';
  }

  function outputCard() {
    var s = state.single;
    var photo = PHOTOS[s.photoIndex];
    var ready = s.phase === 'done';
    var saved = s.saved;
    return '<section class="card">' +
      '<div class="card-head"><div><h2>输出副本</h2><p>默认保存为新图片，原图始终保留</p></div></div>' +
      '<div class="card-body">' +
        '<div class="field-line"><span>媒体库</span><b>旅行相册</b></div>' +
        '<div class="field-line"><span>文件夹</span><b>自动修复</b></div>' +
        '<label class="field"><span>文件名</span><input class="input" data-out-name value="' + esc(photo.out) + '"' + (ready && !saved ? '' : ' disabled') + ' aria-label="副本文件名"></label>' +
        (saved
          ? '<div class="done-line"><span class="ok-ring">' + icon('check') + '</span><div><b>副本已保存</b><small>旅行相册 / 自动修复 · ' + esc(photo.out) + '</small></div></div>'
          : '<button type="button" class="btn primary block" data-action="single-save"' + (ready ? '' : ' disabled') + '>' + icon('save') + (ready ? '保存副本' : '修复完成后可保存') + '</button>') +
        '<p class="save-note">' + icon('info') + '<span>重名时自动编号；保存失败会提示并保留当前结果。</span></p>' +
      '</div>' +
    '</section>';
  }

  /* =========================================================
     批次
     ========================================================= */

  function batchOf(mode) {
    return mode === 'auto' ? state.auto : state.review;
  }

  function batchPage(mode) {
    var batch = batchOf(mode);
    var t = tally(batch.items);
    var isReview = mode === 'review';
    var actions = '';

    if (batch.status === 'running' || batch.status === 'paused') {
      actions += '<button type="button" class="btn" data-action="toggle-pause" data-batch="' + mode + '">' +
        (batch.status === 'paused' ? icon('play') + '继续' : icon('pause') + '暂停') + '</button>';
      actions += '<button type="button" class="btn danger" data-action="cancel-batch" data-batch="' + mode + '">' + icon('x') + '取消</button>';
    } else {
      actions += '<button type="button" class="btn" data-action="replay" data-batch="' + mode + '">' + icon('refresh') + '重新演示</button>';
    }
    actions += '<button type="button" class="btn primary" data-action="new-batch">' + icon('plus') + '新建批量</button>';

    var pills = '<span class="pill accent">' + (isReview ? '待人工确认' : '全自动') + '</span>' +
      batchStatusPill(batch) +
      '<span class="pill muted">阈值 ' + batch.threshold + '</span>';

    var title = isReview ? '待人工确认的批量' : '全自动批量';
    var desc = isReview
      ? '逐张查看检测结果，通过后才保存副本；批次会等待审核，不自动跳过。原图始终保留。'
      : '检测到水印即保存新副本，无需逐张确认；未检出与失败会记录在项目列表。原图始终保留。';

    return pageHead(title, desc, pills, actions);
  }

  function batchBody(mode) {
    var batch = batchOf(mode);
    return '<div class="stack">' +
      overviewCard(batch) +
      (mode === 'auto' ? logCard(batch) : '') +
      itemsCard(batch) +
    '</div>';
  }

  function overviewCard(batch) {
    var t = tally(batch.items);
    var p = progressOf(batch);
    var isReview = batch.mode === 'review';
    var remaining = batch.items.length - p.done;
    var estimate = remaining > 0 && batch.status === 'running' ? fmtDuration(remaining * 8.2) : '—';
    var tone = batch.status === 'completed' ? 'ok' : batch.status === 'paused' ? 'warn' : batch.status === 'cancelled' ? 'muted' : '';

    return '<section class="card">' +
      '<div class="card-head">' +
        '<div><h2>批次概览</h2><p>' + (isReview ? '串行处理，每次一张；等待审核时队列暂停。' : '串行处理，成功后自动保存副本。') + '</p></div>' +
        batchStatusPill(batch) +
      '</div>' +
      '<div class="card-body">' +
        '<dl class="meta-grid">' +
          '<div class="meta"><dt>处理模式</dt><dd>' + (isReview ? '待人工确认' : '全自动') + '</dd></div>' +
          '<div class="meta"><dt>检测阈值</dt><dd><b>' + batch.threshold + '</b> <span class="muted">/ 255</span></dd></div>' +
          '<div class="meta"><dt>保存到</dt><dd>' + esc(batch.destination) + '</dd></div>' +
          '<div class="meta"><dt>创建时间</dt><dd>' + esc(batch.created) + '</dd></div>' +
          '<div class="meta"><dt>项目</dt><dd><b>' + batch.items.length + '</b> 张</dd></div>' +
        '</dl>' +
        '<div class="prog-block">' +
          '<div class="prog-head"><span>处理进度</span><b>' + p.pct + '%</b></div>' +
          '<div class="bar ' + tone + '"><i style="width:' + p.pct + '%"></i></div>' +
          '<div class="prog-sub">' + p.done + ' / ' + p.total + ' 已处理 · 预计剩余 ' + estimate + '</div>' +
        '</div>' +
        '<div class="stats">' +
          stat(t.saved, '已保存', 'ok') +
          stat(t.review, '待审核', 'warn') +
          stat(t.pending + t.working, '处理中', 'accent') +
          stat(t.no_detection, '未检出', 'muted') +
          stat(t.failed, '失败', 'bad') +
        '</div>' +
        batchCallout(batch) +
        '<div class="overview-foot">' +
          '<span class="hint">' + (isReview ? '通过审核才写入副本；跳过与失败不会产生文件。' : '自动保存到目标文件夹；重名自动编号。') + '</span>' +
          ((isReview && batch.status === 'running' && !batch.autoApprove)
            ? '<button type="button" class="btn ghost sm" data-action="auto-approve" data-batch="review">演示：自动通过剩余</button>'
            : (isReview && batch.autoApprove ? '<span class="pill accent">演示自动通过已开启</span>' : '')) +
        '</div>' +
      '</div>' +
    '</section>';
  }

  function stat(value, label, tone) {
    return '<div class="stat"><b>' + value + '</b><span><i class="dot ' + tone + '"></i>' + label + '</span></div>';
  }

  function batchCallout(batch) {
    var t = tally(batch.items);
    var isReview = batch.mode === 'review';

    if (batch.status === 'cancelled') {
      return '<div class="callout">' + icon('info') +
        '<div class="callout-main"><b>批次已取消</b><small>已保存的 ' + t.saved + ' 张副本保留；其余项目已停止。原图未受影响。</small></div>' +
        '<button type="button" class="btn sm" data-action="replay" data-batch="' + batch.mode + '">' + icon('refresh') + '重新演示</button>' +
      '</div>';
    }

    if (batch.status === 'completed') {
      var parts = [];
      if (t.saved) parts.push('已保存 ' + t.saved + ' 张');
      if (t.no_detection) parts.push('未检出 ' + t.no_detection + ' 张');
      if (t.failed) parts.push('失败 ' + t.failed + ' 张');
      if (t.skipped) parts.push('跳过 ' + t.skipped + ' 张');
      return '<div class="callout ok">' + icon('check') +
        '<div class="callout-main"><b>批次已完成</b><small>' + (parts.join('，') || '没有可保存的结果') + '。原图均未修改。</small></div>' +
        '<div class="callout-actions">' +
          (t.failed ? '<button type="button" class="btn sm" data-action="retry-failed" data-batch="' + batch.mode + '">重试失败项</button>' : '') +
          '<button type="button" class="btn sm" data-action="replay" data-batch="' + batch.mode + '">' + icon('refresh') + '重新演示</button>' +
        '</div>' +
      '</div>';
    }

    if (batch.status === 'paused') {
      return '<div class="callout warn">' + icon('pause') +
        '<div class="callout-main"><b>批次已暂停</b><small>排队中的图片不会开始；当前审核结果仍保留。</small></div>' +
        '<button type="button" class="btn primary sm" data-action="toggle-pause" data-batch="' + batch.mode + '">' + icon('play') + '继续</button>' +
      '</div>';
    }

    if (isReview) {
      var review = batch.items.filter(function (item) { return item.status === 'review'; })[0];
      if (review) {
        return '<div class="callout warn">' +
          '<span class="thumb lg" style="--a:' + review.a + ';--b:' + review.b + '"></span>' +
          '<div class="callout-main"><b>' + esc(review.name) + ' 等待确认</b><small>检测到 1 处区域 · 检测分数 ' + (review.score == null ? '—' : review.score.toFixed(2)) + ' · 阈值 ' + batch.threshold + '</small></div>' +
          '<button type="button" class="btn primary sm" data-action="review-open" data-batch="review" data-id="' + review.id + '">' + icon('eye') + '审核</button>' +
        '</div>';
      }
    }

    var working = batch.items.filter(function (item) { return item.status === 'generating' || item.status === 'saving'; })[0];
    if (working) {
      return '<div class="callout">' +
        '<span class="spinner"></span>' +
        '<div class="callout-main"><b>正在处理 ' + esc(working.name) + '</b><small>' + (working.status === 'saving' ? '正在写入新副本…' : 'SLBR 检测与蒙版生成…') + '</small></div>' +
        '<span class="pill accent">约 8 秒</span>' +
      '</div>';
    }

    return '<div class="callout">' + icon('clock') +
      '<div class="callout-main"><b>等待下一张</b><small>队列将自动继续。</small></div>' +
    '</div>';
  }

  function itemsCard(batch) {
    var filters = batch.mode === 'review'
      ? [['all', '全部'], ['review', '待审核'], ['failed', '失败'], ['saved', '已保存']]
      : null;
    var activeFilter = batch.filter || 'all';
    var items = batch.items.filter(function (item) {
      if (!filters || activeFilter === 'all') return true;
      if (activeFilter === 'review') return item.status === 'review';
      if (activeFilter === 'failed') return item.status === 'failed';
      if (activeFilter === 'saved') return item.status === 'saved';
      return true;
    });

    var filterMarkup = filters
      ? '<div class="seg" role="group" aria-label="筛选项目">' + filters.map(function (pair) {
          return '<button type="button" data-action="filter" data-filter="' + pair[0] + '" aria-pressed="' + (activeFilter === pair[0]) + '">' + pair[1] + '</button>';
        }).join('') + '</div>'
      : '';

    return '<section class="card">' +
      '<div class="card-head">' +
        '<div><h2>项目</h2><p>' + (batch.mode === 'review' ? '逐项查看检测结果与审核状态' : '自动处理结果与失败记录') + '</p></div>' +
        filterMarkup +
      '</div>' +
      '<div class="items">' + (items.length ? items.map(function (item) { return itemRow(item, batch); }).join('') : '<div class="empty">当前筛选下没有项目。</div>') + '</div>' +
    '</section>';
  }

  function itemRow(item, batch) {
    var meta = ITEM_STATUS[item.status] || ['未知', 'muted'];
    var action = '';
    if (item.status === 'review') {
      action = '<button type="button" class="btn primary sm" data-action="review-open" data-batch="' + batch.mode + '" data-id="' + item.id + '">审核</button>';
    } else if (item.status === 'failed') {
      action = '<button type="button" class="btn sm" data-action="retry" data-batch="' + batch.mode + '" data-id="' + item.id + '">重试</button>';
    } else if (item.status === 'saved' || item.status === 'no_detection' || item.status === 'skipped' || item.status === 'cancelled') {
      action = '<button type="button" class="btn ghost sm" data-action="item-info" data-batch="' + batch.mode + '" data-id="' + item.id + '">查看</button>';
    }

    return '<div class="item">' +
      '<span class="thumb" style="--a:' + item.a + ';--b:' + item.b + '" aria-hidden="true"></span>' +
      '<div class="item-main">' +
        '<div class="item-name" title="' + esc(item.name) + '">' + esc(item.name) + '</div>' +
        '<div class="item-sub">' +
          '<span>' + item.size + '</span><span class="sep">·</span><span>' + item.bytes + '</span>' +
          '<span class="sub-status" style="color:var(--' + (meta[1] === 'ok' ? 'ok' : meta[1] === 'warn' ? 'warn' : meta[1] === 'bad' ? 'bad' : 'muted') + ')">' + meta[0] + '</span>' +
        '</div>' +
        (item.error ? '<div class="item-error">' + esc(item.error) + '</div>' : '') +
      '</div>' +
      '<div class="item-conf"><b>' + (item.score == null ? '—' : item.score.toFixed(2)) + '</b><small>检测分数</small></div>' +
      '<div class="item-state">' + statusPill(item.status, item.status === 'generating' || item.status === 'saving') + '</div>' +
      '<div class="item-act">' + action + '</div>' +
    '</div>';
  }

  function logCard(batch) {
    var logs = batch.logs.slice(0, 8);
    return '<section class="card">' +
      '<div class="card-head"><div><h2>处理记录</h2><p>自动保存与跳过原因</p></div><span class="pill muted">最近 ' + logs.length + ' 条</span></div>' +
      (logs.length
        ? '<ul class="log">' + logs.map(function (entry) {
            return '<li><i class="log-dot ' + entry.tone + '"></i><span>' + esc(entry.text) + '</span><time>' + esc(entry.t) + '</time></li>';
          }).join('') + '</ul>'
        : '<div class="empty">还没有处理记录。</div>') +
    '</section>';
  }

  /* =========================================================
     弹层
     ========================================================= */

  function renderModal() {
    var root = document.getElementById('modal-root');
    if (!root) return;
    if (!state.modal) {
      root.innerHTML = '';
      document.body.classList.remove('has-modal');
      return;
    }
    root.innerHTML = '<div class="modal-layer"><div class="scrim" data-action="close-modal"></div>' + modalMarkup(state.modal) + '</div>';
    document.body.classList.add('has-modal');
    initCompare();
    window.requestAnimationFrame(function () {
      var modal = root.querySelector('.modal');
      if (modal) {
        modal.setAttribute('tabindex', '-1');
        modal.focus({ preventScroll: true });
      }
    });
  }

  function modalMarkup(modal) {
    if (modal.type === 'create') return createModal(modal);
    if (modal.type === 'cancel') return cancelModal(modal);
    if (modal.type === 'review') return reviewModal(modal);
    return '';
  }

  function closeModal() {
    state.modal = null;
    renderModal();
  }

  function createModal(modal) {
    var selected = modal.selected.length;
    var isReview = modal.mode === 'review';
    return '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal-head">' +
        '<div><h2 id="modal-title">新建批量修复</h2><p>示例数据演示媒体选择、保存位置与处理模式；不会调用真实接口。</p></div>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">' + icon('x') + '</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="field-block">' +
          '<span class="field-label">处理模式</span>' +
          '<div class="seg full" role="group" aria-label="处理模式">' +
            '<button type="button" data-action="create-mode" data-mode="review" aria-pressed="' + isReview + '">待人工确认</button>' +
            '<button type="button" data-action="create-mode" data-mode="auto" aria-pressed="' + !isReview + '">全自动</button>' +
          '</div>' +
          '<p class="hint">' + (isReview ? '每张检测完成后等待审核，通过后才写入副本。' : '检测到水印即保存副本，未检出与失败会记录在列表中。') + '</p>' +
        '</div>' +
        '<div class="field-block">' +
          '<div class="pick-head"><span>选择图片 · <b>' + selected + '</b> / ' + PICK_POOL.length + '</span>' +
            '<button type="button" class="btn ghost sm" data-action="pick-all">' + (selected === PICK_POOL.length ? '清空' : '全选') + '</button>' +
          '</div>' +
          '<div class="pick-grid">' + PICK_POOL.map(function (item, index) {
            var on = modal.selected.indexOf(item.id) >= 0;
            var p = PALETTE[index % PALETTE.length];
            return '<button type="button" class="pick" data-action="pick" data-id="' + item.id + '" aria-pressed="' + on + '" aria-label="' + esc(item.name) + '">' +
              '<span class="tick">' + icon('check') + '</span>' +
              '<span class="pick-name">' + esc(item.name) + '</span>' +
            '</button>';
          }).join('') + '</div>' +
        '</div>' +
        '<div class="field-block" data-thr-scope>' +
          '<div class="thr-head"><label for="create-thr">检测阈值</label><output data-thr-out>' + modal.threshold + '</output></div>' +
          '<input id="create-thr" type="range" min="1" max="254" value="' + modal.threshold + '" data-range="create">' +
          '<div class="thr-scale"><span>1 · 更敏感</span><span>254 · 更保守</span></div>' +
        '</div>' +
        '<div class="field-block">' +
          '<label for="create-dest">保存位置</label>' +
          '<select id="create-dest" class="input" data-change="destination">' +
            '<option' + (modal.destination === '旅行相册 / 自动修复' ? ' selected' : '') + '>旅行相册 / 自动修复</option>' +
            '<option' + (modal.destination === '旅行相册 / 待整理' ? ' selected' : '') + '>旅行相册 / 待整理</option>' +
            '<option' + (modal.destination === '家庭相册 / 修复副本' ? ' selected' : '') + '>家庭相册 / 修复副本</option>' +
          '</select>' +
        '</div>' +
        '<div class="note"><b>示例说明：</b>批次串行处理，任一时刻只有一张在推理或等待审核；原始图片不会被覆盖。模型分数仅用于区域排序，不代表准确率。</div>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button type="button" class="btn ghost" data-action="close-modal">取消</button>' +
        '<button type="button" class="btn primary" data-action="create-batch"' + (selected ? '' : ' disabled') + '>' + icon('plus') + '创建批次</button>' +
      '</div>' +
    '</div>';
  }

  function cancelModal(modal) {
    var batch = batchOf(modal.batch);
    var t = tally(batch.items);
    return '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal-head">' +
        '<div><h2 id="modal-title">取消这个批次？</h2>' +
        '<p>已保存的 ' + t.saved + ' 张副本会保留；排队、处理中和待审核的项目将停止，不再产生新副本。原图不受影响。</p></div>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">' + icon('x') + '</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="note">取消后可以重新演示或新建批次；原型不会写入任何文件。</div>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button type="button" class="btn ghost" data-action="close-modal">返回</button>' +
        '<button type="button" class="btn danger" data-action="confirm-cancel" data-batch="' + modal.batch + '">' + icon('x') + '确认取消</button>' +
      '</div>' +
    '</div>';
  }

  function reviewModal(modal) {
    var batch = batchOf(modal.batch);
    var item = batch.items.filter(function (row) { return row.id === modal.itemId; })[0];
    if (!item) return '';
    return '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal-head">' +
        '<div><h2 id="modal-title">审核这一张</h2><p>通过后会保存为新副本；跳过不会产生文件，原图保持不变。</p></div>' +
        '<button type="button" class="icon-btn" data-action="close-modal" aria-label="关闭">' + icon('x') + '</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="review-compare">' +
          '<div class="compare" data-compare role="slider" tabindex="0" aria-label="原图与修复预览对比，拖动分割线" aria-valuemin="0" aria-valuemax="100" aria-valuenow="56" style="--split:56%">' +
            '<div class="layer">' + sceneMarkup(false) + '</div>' +
            '<div class="layer after">' + sceneMarkup(true) + '</div>' +
            '<span class="cmp-tag left">原图</span>' +
            '<span class="cmp-tag right">修复预览</span>' +
            '<span class="handle" aria-hidden="true"><i>⇄</i></span>' +
          '</div>' +
        '</div>' +
        '<dl class="meta-grid">' +
          '<div class="meta"><dt>文件</dt><dd>' + esc(item.name) + '</dd></div>' +
          '<div class="meta"><dt>尺寸</dt><dd>' + item.size + '</dd></div>' +
          '<div class="meta"><dt>检测分数</dt><dd>' + (item.score == null ? '—' : item.score.toFixed(2)) + '</dd></div>' +
          '<div class="meta"><dt>检测阈值</dt><dd>' + batch.threshold + '</dd></div>' +
        '</dl>' +
        '<div class="note">检测分数来自 SLBR 概率蒙版，仅用于区域排序；尚未验证准确率，不代表最终修复质量。</div>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button type="button" class="btn ghost" data-action="close-modal">稍后</button>' +
        '<button type="button" class="btn" data-action="skip" data-batch="review" data-id="' + item.id + '">' + icon('x') + '跳过</button>' +
        '<button type="button" class="btn primary" data-action="approve" data-batch="review" data-id="' + item.id + '">' + icon('check') + '通过并保存</button>' +
      '</div>' +
    '</div>';
  }

  /* =========================================================
     对比分割线
     ========================================================= */

  function initCompare() {
    document.querySelectorAll('[data-compare]').forEach(function (root) {
      if (root.dataset.bound) return;
      root.dataset.bound = '1';
      var apply = function (clientX) {
        var rect = root.getBoundingClientRect();
        if (rect.width < 10) return;
        var pct = Math.min(96, Math.max(4, ((clientX - rect.left) / rect.width) * 100));
        root.style.setProperty('--split', pct.toFixed(1) + '%');
        root.setAttribute('aria-valuenow', String(Math.round(pct)));
        if (root.closest('.stage')) state.single.split = Math.round(pct);
      };
      root.addEventListener('pointerdown', function (event) {
        if (event.button !== undefined && event.button !== 0) return;
        root.classList.add('dragging');
        if (root.setPointerCapture) root.setPointerCapture(event.pointerId);
        apply(event.clientX);
        event.preventDefault();
      });
      root.addEventListener('pointermove', function (event) {
        if (!root.classList.contains('dragging')) return;
        apply(event.clientX);
      });
      var end = function () { root.classList.remove('dragging'); };
      root.addEventListener('pointerup', end);
      root.addEventListener('pointercancel', end);
      root.addEventListener('keydown', function (event) {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        var current = parseFloat(getComputedStyle(root).getPropertyValue('--split')) || 56;
        var next = Math.min(96, Math.max(4, current + (event.key === 'ArrowRight' ? 4 : -4)));
        root.style.setProperty('--split', next + '%');
        root.setAttribute('aria-valuenow', String(Math.round(next)));
      });
    });
  }

  /* =========================================================
     单图逻辑
     ========================================================= */

  function resetSingle(keepPhoto) {
    var s = state.single;
    window.clearTimeout(detectTimer);
    window.clearInterval(repairTimer);
    s.phase = 'detected';
    s.progress = 0;
    s.saved = false;
    s.showMask = true;
    s.split = 58;
    s.regions.forEach(function (region) { region.on = true; });
    if (!keepPhoto) s.photoIndex = 0;
    render();
  }

  function runDetection() {
    var s = state.single;
    window.clearTimeout(detectTimer);
    window.clearInterval(repairTimer);
    s.phase = 'detecting';
    s.progress = 0;
    s.saved = false;
    s.regions.forEach(function (region) { region.on = true; });
    render();
    detectTimer = window.setTimeout(function () {
      if (s.phase !== 'detecting') return;
      var found = s.regions.filter(function (region) {
        return Math.round(region.score * 255) >= s.threshold;
      });
      if (!found.length) {
        s.phase = 'empty';
        render();
        toast('阈值 ' + s.threshold + ' 下没有区域超过阈值，未生成副本。', 'warn');
      } else {
        s.phase = 'detected';
        render();
        toast('检测完成，找到 ' + found.length + ' 处可能的修复区域。', 'ok');
      }
    }, 1600);
  }

  function startRepair() {
    var s = state.single;
    if (!activeRegions().length) {
      toast('没有启用的修复区域，请调整阈值或区域开关。', 'warn');
      return;
    }
    s.phase = 'repairing';
    s.progress = 0;
    s.saved = false;
    s.startedAt = Date.now();
    render();
    repairTimer = window.setInterval(function () {
      if (s.phase !== 'repairing') {
        window.clearInterval(repairTimer);
        return;
      }
      s.progress = Math.min(100, s.progress + 3 + Math.random() * 5);
      if (s.progress >= 100) {
        s.progress = 100;
        s.phase = 'done';
        window.clearInterval(repairTimer);
        render();
        toast('修复完成，拖动对比后保存副本。', 'ok');
      } else {
        paintSingleProgress();
      }
    }, 200);
  }

  function paintSingleProgress() {
    var s = state.single;
    var pct = Math.round(s.progress);
    var pctNode = document.querySelector('[data-single-pct]');
    var barNode = document.querySelector('[data-single-bar]');
    var statusNode = document.querySelector('[data-single-status]');
    var stageNode = document.querySelector('[data-stage-working]');
    var stagePct = document.querySelector('[data-stage-pct]');
    if (pctNode) pctNode.textContent = pct + '%';
    if (barNode) barNode.style.width = pct + '%';
    if (statusNode) statusNode.textContent = pct < 40 ? '正在生成蒙版…' : pct < 82 ? '正在重建细节…' : '正在合成色彩…';
    if (stageNode) stageNode.textContent = pct < 40 ? '正在生成蒙版…' : pct < 82 ? '正在重建细节…' : '正在合成色彩…';
    if (stagePct) stagePct.textContent = pct + '%';
    var active = pct < 45 ? 1 : pct < 84 ? 2 : 3;
    document.querySelectorAll('[data-step]').forEach(function (node, index) {
      node.classList.toggle('is-done', index < active);
      node.classList.toggle('is-active', index === active);
    });
  }

  function cancelSingle() {
    window.clearTimeout(detectTimer);
    window.clearInterval(repairTimer);
    var s = state.single;
    s.phase = 'cancelled';
    s.progress = 0;
    s.saved = false;
    render();
    toast('已取消，未生成任何副本。', 'warn');
  }

  function saveSingle() {
    var s = state.single;
    if (s.phase !== 'done' || s.saved) return;
    var input = document.querySelector('[data-out-name]');
    var name = input && input.value.trim() ? input.value.trim() : PHOTOS[s.photoIndex].out;
    s.saved = true;
    render();
    toast('已保存副本「' + name + '」到 旅行相册 / 自动修复。', 'ok');
  }

  /* =========================================================
     批次逻辑
     ========================================================= */

  function addLog(batch, text, tone) {
    batch.logs.unshift({ t: nowTime(), text: text, tone: tone || 'muted' });
    if (batch.logs.length > 12) batch.logs.length = 12;
  }

  function checkComplete(batch) {
    if (batch.status !== 'running') return;
    var active = batch.items.some(function (item) {
      return item.status === 'pending' || item.status === 'generating' || item.status === 'review' || item.status === 'saving';
    });
    if (active) return;
    batch.status = 'completed';
    var t = tally(batch.items);
    var parts = [];
    if (t.saved) parts.push('已保存 ' + t.saved + ' 张');
    if (t.no_detection) parts.push('未检出 ' + t.no_detection + ' 张');
    if (t.failed) parts.push('失败 ' + t.failed + ' 张');
    if (t.skipped) parts.push('跳过 ' + t.skipped + ' 张');
    addLog(batch, '批次完成 · ' + (parts.join('，') || '无结果'), 'ok');
    toast('批次已完成 · ' + (parts.join('，') || '没有可保存的结果'), 'ok');
  }

  function tickReview() {
    var batch = state.review;
    if (batch.status !== 'running') return false;
    var items = batch.items;
    var changed = false;
    var saving = items.filter(function (item) { return item.status === 'saving'; })[0];
    if (saving) {
      saving.status = 'saved';
      changed = true;
    } else {
      var generating = items.filter(function (item) { return item.status === 'generating'; })[0];
      if (generating) {
        if (generating.planned === 'no_detection') {
          generating.status = 'no_detection';
        } else if (generating.planned === 'failed') {
          generating.status = 'failed';
          generating.error = '推理服务超时，已重试 3 次';
        } else {
          generating.status = 'review';
          generating.score = generating.plannedScore;
        }
        changed = true;
      } else {
        var waiting = items.filter(function (item) { return item.status === 'review'; })[0];
        if (waiting && batch.autoApprove) {
          waiting.status = 'saving';
          changed = true;
        } else if (!waiting) {
          var pending = items.filter(function (item) { return item.status === 'pending'; })[0];
          if (pending) {
            pending.status = 'generating';
            changed = true;
          }
        }
      }
    }
    if (changed) checkComplete(batch);
    return changed;
  }

  function tickAuto() {
    var batch = state.auto;
    if (batch.status !== 'running') return false;
    var items = batch.items;
    var saving = items.filter(function (item) { return item.status === 'saving'; })[0];
    if (saving) {
      saving.status = 'saved';
      addLog(batch, '已保存 ' + outName(saving.name), 'ok');
      checkComplete(batch);
      return true;
    }
    var generating = items.filter(function (item) { return item.status === 'generating'; })[0];
    if (generating) {
      if (generating.planned === 'no_detection') {
        generating.status = 'no_detection';
        addLog(batch, generating.name + ' 未检出可修复区域', 'muted');
      } else if (generating.planned === 'failed') {
        generating.status = 'failed';
        generating.error = '推理服务超时，已重试 3 次';
        addLog(batch, generating.name + ' 失败：推理服务超时', 'bad');
      } else {
        generating.status = 'saving';
        generating.score = generating.plannedScore;
      }
      checkComplete(batch);
      return true;
    }
    var pending = items.filter(function (item) { return item.status === 'pending'; })[0];
    if (pending) {
      pending.status = 'generating';
      return true;
    }
    checkComplete(batch);
    return false;
  }

  function togglePause(mode) {
    var batch = batchOf(mode);
    if (batch.status === 'running') {
      batch.status = 'paused';
      toast('批次已暂停，排队中的图片不会开始。', 'warn');
    } else if (batch.status === 'paused') {
      batch.status = 'running';
      toast('已继续处理批次。', 'ok');
    }
    render();
  }

  function cancelBatch(mode) {
    var batch = batchOf(mode);
    batch.items.forEach(function (item) {
      if (item.status === 'pending' || item.status === 'generating' || item.status === 'review' || item.status === 'saving') {
        item.status = 'cancelled';
      }
    });
    batch.status = 'cancelled';
    if (state.modal && state.modal.type === 'cancel') state.modal = null;
    render();
    renderModal();
    toast('批次已取消，已保存的副本保留。', 'warn');
  }

  function replay(mode) {
    if (mode === 'auto') state.auto = seedBatch('auto');
    else state.review = seedBatch('review');
    render();
    toast('已重置演示批次。', 'ok');
  }

  function approveItem(id) {
    var item = state.review.items.filter(function (row) { return row.id === id; })[0];
    if (!item || item.status !== 'review') return;
    item.status = 'saving';
    closeModal();
    render();
    toast('已通过审核，正在保存副本…', 'ok');
  }

  function skipItem(id) {
    var item = state.review.items.filter(function (row) { return row.id === id; })[0];
    if (!item || item.status !== 'review') return;
    item.status = 'skipped';
    closeModal();
    render();
    toast('已跳过这一张，未生成副本。', 'warn');
  }

  function retryItem(mode, id) {
    var batch = batchOf(mode);
    var item = batch.items.filter(function (row) { return row.id === id; })[0];
    if (!item) return;
    item.status = 'pending';
    item.error = null;
    item.planned = 'saved';
    if (batch.status === 'completed') batch.status = 'running';
    render();
    toast('已重新排队，将再试一次。', 'accent');
  }

  function retryAllFailed(mode) {
    var batch = batchOf(mode);
    batch.items.forEach(function (item) {
      if (item.status === 'failed') {
        item.status = 'pending';
        item.error = null;
        item.planned = 'saved';
      }
    });
    batch.status = 'running';
    render();
    toast('失败项目已重新排队。', 'accent');
  }

  function openReview(mode, id) {
    state.modal = { type: 'review', batch: mode, itemId: id };
    renderModal();
  }

  function createBatch() {
    var modal = state.modal;
    if (!modal || modal.type !== 'create' || !modal.selected.length) return;
    var chosen = PICK_POOL.filter(function (item) { return modal.selected.indexOf(item.id) >= 0; });
    var items = chosen.map(function (item, index) {
      var p = PALETTE[index % PALETTE.length];
      return {
        id: modal.mode + '-' + Date.now() + '-' + index,
        name: item.name, size: item.size, bytes: item.bytes, a: p[0], b: p[1],
        status: 'pending', score: null, error: null,
        planned: index === 5 ? 'no_detection' : index === 7 ? 'failed' : 'saved',
        plannedScore: Math.round((0.83 + ((index * 3) % 12) / 100) * 100) / 100
      };
    });
    var batch = {
      mode: modal.mode,
      status: 'running',
      threshold: modal.threshold,
      destination: modal.destination,
      created: '刚刚',
      items: items,
      logs: modal.mode === 'auto' ? [{ t: nowTime(), text: '批次开始 · ' + items.length + ' 张 · 阈值 ' + modal.threshold, tone: 'accent' }] : [],
      filter: 'all',
      autoApprove: false
    };
    if (modal.mode === 'auto') state.auto = batch;
    else state.review = batch;
    state.view = modal.mode;
    state.modal = null;
    render();
    renderModal();
    toast('已创建 ' + items.length + ' 张的' + (modal.mode === 'review' ? '待审核' : '全自动') + '批次。', 'ok');
  }

  /* =========================================================
     事件
     ========================================================= */

  document.addEventListener('click', function (event) {
    var el = event.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;

    if (action === 'view') {
      state.view = el.dataset.view;
      closeModal();
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (action === 'new-batch') {
      state.modal = {
        type: 'create',
        mode: 'review',
        threshold: 128,
        selected: PICK_POOL.map(function (item) { return item.id; }),
        destination: '旅行相册 / 自动修复'
      };
      renderModal();
      return;
    }
    if (action === 'close-modal') {
      closeModal();
      return;
    }
    if (action === 'create-mode') {
      if (state.modal && state.modal.type === 'create') {
        state.modal.mode = el.dataset.mode;
        renderModal();
      }
      return;
    }
    if (action === 'pick') {
      if (!state.modal || state.modal.type !== 'create') return;
      var id = el.dataset.id;
      var index = state.modal.selected.indexOf(id);
      if (index >= 0) state.modal.selected.splice(index, 1);
      else state.modal.selected.push(id);
      renderModal();
      return;
    }
    if (action === 'pick-all') {
      if (!state.modal || state.modal.type !== 'create') return;
      state.modal.selected = state.modal.selected.length === PICK_POOL.length
        ? []
        : PICK_POOL.map(function (item) { return item.id; });
      renderModal();
      return;
    }
    if (action === 'create-batch') {
      createBatch();
      return;
    }
    if (action === 'toggle-pause') {
      togglePause(el.dataset.batch);
      return;
    }
    if (action === 'cancel-batch') {
      state.modal = { type: 'cancel', batch: el.dataset.batch };
      renderModal();
      return;
    }
    if (action === 'confirm-cancel') {
      cancelBatch(el.dataset.batch);
      return;
    }
    if (action === 'replay') {
      replay(el.dataset.batch);
      return;
    }
    if (action === 'auto-approve') {
      var batch = batchOf(el.dataset.batch);
      batch.autoApprove = true;
      render();
      toast('演示模式：后续待审核项将自动通过。', 'warn');
      return;
    }
    if (action === 'review-open') {
      openReview(el.dataset.batch, el.dataset.id);
      return;
    }
    if (action === 'approve') {
      approveItem(el.dataset.id);
      return;
    }
    if (action === 'skip') {
      skipItem(el.dataset.id);
      return;
    }
    if (action === 'retry') {
      retryItem(el.dataset.batch, el.dataset.id);
      return;
    }
    if (action === 'retry-failed') {
      retryAllFailed(el.dataset.batch);
      return;
    }
    if (action === 'filter') {
      state.review.filter = el.dataset.filter;
      render();
      return;
    }
    if (action === 'item-info') {
      var infoBatch = batchOf(el.dataset.batch);
      var infoItem = infoBatch.items.filter(function (row) { return row.id === el.dataset.id; })[0];
      if (!infoItem) return;
      if (infoItem.status === 'saved') toast('副本已保存：' + outName(infoItem.name), 'ok');
      else if (infoItem.status === 'no_detection') toast(infoItem.name + ' 未检出可修复区域。', 'warn');
      else if (infoItem.status === 'skipped') toast(infoItem.name + ' 已跳过，未生成副本。', 'warn');
      else toast(infoItem.name + ' 当前状态：' + (ITEM_STATUS[infoItem.status] ? ITEM_STATUS[infoItem.status][0] : '未知'), 'accent');
      return;
    }
    if (action === 'toggle-region') {
      var region = state.single.regions.filter(function (row) { return row.id === el.dataset.id; })[0];
      if (!region) return;
      if (Math.round(region.score * 255) < state.single.threshold) {
        toast('该区域低于当前阈值，提高敏感度后才能启用。', 'warn');
        return;
      }
      region.on = !region.on;
      render();
      return;
    }
    if (action === 'single-detect') {
      runDetection();
      return;
    }
    if (action === 'single-start') {
      startRepair();
      return;
    }
    if (action === 'single-cancel') {
      cancelSingle();
      return;
    }
    if (action === 'single-reset') {
      resetSingle(true);
      return;
    }
    if (action === 'single-lower') {
      var s = state.single;
      s.threshold = Math.max(24, s.threshold - 48);
      runDetection();
      return;
    }
    if (action === 'single-save') {
      saveSingle();
      return;
    }
    if (action === 'single-swap') {
      var single = state.single;
      single.photoIndex = (single.photoIndex + 1) % PHOTOS.length;
      window.clearTimeout(detectTimer);
      window.clearInterval(repairTimer);
      single.phase = 'detected';
      single.progress = 0;
      single.saved = false;
      single.regions.forEach(function (row) { row.on = true; });
      render();
      toast('已切换示例图片。', 'accent');
      return;
    }
    if (action === 'drop-hint') {
      toast('原型使用示例图片；接入后这里支持拖放与粘贴。', 'accent');
      return;
    }
  });

  document.addEventListener('change', function (event) {
    var el = event.target;

    if (el.matches('[data-change="mask"]')) {
      state.single.showMask = el.checked;
      render();
      return;
    }
    if (el.matches('[data-change="region"]')) {
      var region = state.single.regions.filter(function (row) { return row.id === el.dataset.id; })[0];
      if (region) region.on = el.checked;
      render();
      return;
    }
    if (el.matches('[data-change="destination"]')) {
      if (state.modal && state.modal.type === 'create') state.modal.destination = el.value;
      return;
    }
    if (el.matches('[data-range="single"]')) {
      var s = state.single;
      s.threshold = Number(el.value);
      if (s.phase === 'detected' || s.phase === 'done' || s.phase === 'empty') {
        s.phase = 'stale';
        s.saved = false;
      }
      render();
      return;
    }
  });

  document.addEventListener('input', function (event) {
    var el = event.target;
    if (!el.matches('input[type="range"]')) return;
    var scope = el.closest('[data-thr-scope]');
    if (scope) {
      scope.querySelectorAll('[data-thr-out]').forEach(function (out) {
        out.textContent = el.value;
      });
    }
    if (el.matches('[data-range="single"]')) state.single.threshold = Number(el.value);
    if (el.matches('[data-range="create"]') && state.modal && state.modal.type === 'create') {
      state.modal.threshold = Number(el.value);
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.modal) {
      closeModal();
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && event.target.classList && event.target.classList.contains('drop-hint')) {
      event.preventDefault();
      toast('原型使用示例图片；接入后这里支持拖放与粘贴。', 'accent');
    }
  });

  window.addEventListener('resize', function () {
    initCompare();
  });

  /* =========================================================
     定时推进（仅示例模拟）
     ========================================================= */

  window.setInterval(function () {
    var reviewChanged = tickReview();
    var autoChanged = tickAuto();

    if (state.modal && state.modal.type === 'review') {
      var modalItem = state.review.items.filter(function (row) { return row.id === state.modal.itemId; })[0];
      if (!modalItem || modalItem.status !== 'review') {
        state.modal = null;
        renderModal();
      }
    }

    if ((reviewChanged && state.view === 'review') || (autoChanged && state.view === 'auto')) {
      render();
    }
  }, 1100);

  /* ---------- 初始渲染 ---------- */
  render();
  renderModal();
})();
</script>
</body>
</html>
