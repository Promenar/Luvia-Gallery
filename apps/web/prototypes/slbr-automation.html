<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SLBR 自动修复 · 交互原型</title>
<style>
/* =========================================================
   Luvia Gallery · SLBR 自动修复交互原型
   视觉令牌沿用 apps/web/src/styles/app.css；
   版面与组件参考 pages/editor/editor-page.css 与 pages/admin/ui.tsx。
   仅使用示例数据，不发起任何网络请求。
   ========================================================= */

:root {
  --bg: #121213; --surface: #19191b; --raised: #212124; --sunken: #0c0c0d;
  --fg: #f1f1ef; --fg-2: #c4c4c1; --muted: #8d8d8a;
  --line: rgb(255 255 255 / .08); --line-2: rgb(255 255 255 / .15);
  --accent: #bfbfbf; --accent-fg: #111; --accent-soft: rgb(191 191 191 / .16);
  --ok: #62c08f; --warn: #e0a948; --bad: #ec6a5e;
  --r1: 6px; --r2: 10px; --r3: 16px;
  --font: "Geist Variable", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, dl, dd, dt { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent-soft); }
body.has-modal { overflow: hidden; }

.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 外壳 ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100dvh; }

.rail {
  position: sticky; top: 0; z-index: 30; display: flex; flex-direction: column; gap: 24px;
  height: 100dvh; padding: 20px 14px;
  border-right: 1px solid var(--line);
  background: color-mix(in oklab, var(--surface) 45%, var(--bg));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
.brand-mark {
  position: relative; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px;
  background: linear-gradient(145deg, #e9e9e6, #9a9a96 52%, #4c4c49);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .45), 0 6px 18px -8px rgb(0 0 0 / .8);
}
.brand-mark::before {
  content: ""; width: 12px; height: 12px; border-radius: 50%;
  border: 3px solid #161617; border-right-color: transparent; transform: rotate(-28deg);
}
.brand-word { font-size: 14px; font-weight: 600; letter-spacing: .16em; line-height: 1.1; }
.brand-word small { display: block; margin-top: 3px; font-size: 8.5px; font-weight: 500; letter-spacing: .28em; color: var(--muted); }

.rail-group { display: grid; gap: 7px; }
.rail-label { padding: 0 10px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.nav { display: grid; gap: 3px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; height: 38px; min-width: 0; padding: 0 10px;
  border-radius: var(--r2); color: var(--fg-2); font-size: 13px; text-align: left;
  transition: background .16s ease, color .16s ease;
}
.nav-item:hover { background: var(--accent-soft); color: var(--fg); }
.nav-item.is-active { background: var(--accent-soft); color: var(--fg); }
.nav-item .ico { color: var(--muted); }
.nav-item.is-active .ico { color: var(--fg); }
.nav-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-label .sm { display: none; }
.nav-count {
  display: grid; place-items: center; margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: color-mix(in oklab, var(--warn) 20%, transparent);
  color: var(--warn); font-size: 10.5px; font-weight: 600;
}
.nav-live { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.rail-card {
  margin-top: auto; padding: 13px 14px; border: 1px solid var(--line);
  border-radius: var(--r2); background: var(--sunken);
}
.rail-status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
.rail-status b { font-weight: 600; }
.rail-card > p { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
.rail-rows { display: grid; gap: 6px; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); }
.rail-rows > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); }
.rail-rows b { font-weight: 500; color: var(--fg-2); }
.rail-note { padding: 0 10px; font-size: 10.5px; line-height: 1.5; color: var(--muted); }

.live { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--tone, var(--ok)); animation: pulse 2s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--tone, var(--ok)) 60%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}

.main { min-width: 0; }
.page { max-width: 1220px; margin: 0 auto; padding: 34px 40px 88px; }

/* ---------- 页头 ---------- */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
.page-title { min-width: 0; flex: 1 1 320px; }
.title-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.title-line h1 { font-size: 32px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
.page-desc { max-width: 72ch; margin-top: 7px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- 基础组件 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 34px; padding: 0 13px; border: 1px solid var(--line-2); border-radius: 999px;
  background: transparent; color: var(--fg-2); font-size: 13px; font-weight: 500;
  white-space: nowrap; transition: background .16s ease, color .16s ease, border-color .16s ease, filter .16s ease;
}
.btn:hover { background: var(--accent-soft); color: var(--fg); }
.btn.primary { border-color: transparent; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn.danger { border-color: color-mix(in oklab, var(--bad) 45%, transparent); color: var(--bad); }
.btn.danger:hover { background: color-mix(in oklab, var(--bad) 14%, transparent); }
.btn.ghost { border-color: transparent; color: var(--fg-2); }
.btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.sm .ico { width: 15px; height: 15px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; pointer-events: none; }

.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px;
  border-radius: 999px; font-size: 11.5px; font-weight: 600; line-height: 1.25; white-space: nowrap;
}
.pill.accent { background: var(--accent-soft); color: var(--fg); }
.pill.ok { background: color-mix(in oklab, var(--ok) 18%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.pill.bad { background: color-mix(in oklab, var(--bad) 18%, transparent); color: var(--bad); }
.pill.muted { background: var(--line); color: var(--muted); }
.pill .live { width: 6px; height: 6px; }

.card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r3); background: var(--surface); }
.card-head {
  display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px;
  padding: 15px 18px; border-bottom: 1px solid var(--line);
}
.card-head > div { min-width: 0; flex: 1 1 220px; }
.card-head h2 { font-size: 15px; font-weight: 600; }
.card-head p { margin-top: 3px; max-width: 72ch; font-size: 12.5px; color: var(--muted); }
.card-body { display: grid; gap: 14px; padding: 16px 18px 18px; }

.stack { display: grid; gap: 16px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hint { font-size: 12px; line-height: 1.55; color: var(--muted); }
.hint strong { color: var(--fg-2); font-weight: 500; }

.seg {
  display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px;
  min-width: 0; padding: 3px; border: 1px solid var(--line); border-radius: calc(var(--r2) + 2px); background: var(--sunken);
}
.seg button {
  height: 30px; min-width: 0; padding: 0 12px; border-radius: var(--r2);
  background: transparent; color: var(--muted); font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .16s ease, color .16s ease;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 0 var(--line-2), 0 0 0 1px var(--line); }
.seg.full { display: grid; width: 100%; }

.bar { height: 6px; overflow: hidden; border-radius: 999px; background: var(--line); }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar.ok > i { background: var(--ok); }
.bar.warn > i { background: var(--warn); }
.bar.bad > i { background: var(--bad); }
.bar.muted > i { background: var(--muted); }
.bar.indeterminate > i { width: 34% !important; animation: indeterminate 1.6s ease-in-out infinite; }
@keyframes indeterminate { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }

.spinner { width: 16px; height: 16px; flex: none; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 单图布局 ---------- */
.single-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.single-main { display: grid; gap: 10px; min-width: 0; }
.single-side { display: grid; gap: 14px; min-width: 0; }

.stage {
  position: relative; height: min(64vh, 640px); min-height: 420px; overflow: hidden;
  border: 1px solid var(--line); border-radius: var(--r3); background: #0b0c0e;
  isolation: isolate;
}
.stage-top, .stage-bottom {
  position: absolute; left: 12px; right: 12px; z-index: 7;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; pointer-events: none;
}
.stage-top { top: 12px; }
.stage-bottom { bottom: 12px; justify-content: space-between; }
.stage-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: rgb(0 0 0 / .52); border: 1px solid rgb(255 255 255 / .12);
  color: #ececea; font-size: 11.5px; line-height: 1.35; backdrop-filter: blur(10px);
}
.stage-chip.dim { color: #c8c8c4; }
.stage-chip.accent { color: #fff; border-color: color-mix(in oklab, var(--accent) 45%, transparent); }

.scene-wrap, .scene-wrap > .scene { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, #2c3a46 0%, #5c6d72 38%, #9d8f7a 58%, #6d5c48 74%, #2f2a26 100%); }
.scene-sky { position: absolute; inset: 0 0 44%; background: radial-gradient(120% 90% at 73% 8%, #efd9b2 0%, rgb(239 217 178 / 0) 55%), linear-gradient(180deg, #26333e, #6d7c80); }
.scene-sun {
  position: absolute; top: 10%; left: 61%; width: 27%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #f5dfb7 0%, rgb(245 223 183 / .35) 42%, transparent 70%);
  filter: blur(1px); opacity: .95;
}
.scene-ridge {
  position: absolute; left: -5%; right: -5%; bottom: 31%; height: 37%;
  background: linear-gradient(180deg, #46545a, #2b3439);
  clip-path: polygon(0 68%, 12% 44%, 24% 58%, 38% 26%, 52% 50%, 63% 34%, 78% 56%, 90% 40%, 100% 58%, 100% 100%, 0 100%);
}
.scene-ridge.near {
  bottom: 22%; height: 32%; background: linear-gradient(180deg, #364246, #1d2428); opacity: .96;
  clip-path: polygon(0 74%, 16% 52%, 30% 66%, 46% 42%, 60% 62%, 74% 48%, 88% 66%, 100% 54%, 100% 100%, 0 100%);
}
.scene-water {
  position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
  background:
    repeating-linear-gradient(180deg, rgb(255 255 255 / .035) 0 1px, transparent 1px 8px),
    linear-gradient(180deg, #746a58, #433d33 55%, #262320);
}
.scene-shore { position: absolute; left: 0; right: 0; bottom: 29%; height: 9%; background: linear-gradient(180deg, #8c7d64, #5a4e3d); opacity: .85; }
.scene-grain {
  position: absolute; inset: 0; opacity: .28; mix-blend-mode: overlay;
  background-image: radial-gradient(rgb(255 255 255 / .5) .6px, transparent .6px);
  background-size: 3px 3px;
}
.scene-wm {
  position: absolute; right: 7%; bottom: 15%; padding: 4px 6px;
  font-size: clamp(22px, 4.2vw, 46px); font-weight: 600; line-height: 1.05;
  letter-spacing: .16em; text-align: right; color: rgb(255 255 255 / .38);
  text-shadow: 0 1px 10px rgb(0 0 0 / .25); transform: rotate(-7deg);
  white-space: nowrap;
}
.scene-stamp {
  position: absolute; left: 6%; bottom: 10%; padding: 2px 5px;
  font-size: clamp(9px, 1.2vw, 12px); letter-spacing: .12em; color: rgb(255 255 255 / .42);
  background: rgb(0 0 0 / .14); border: 1px solid rgb(255 255 255 / .1);
}
.scene.clean { filter: saturate(1.06) brightness(1.025); }
.scene.clean .scene-wm, .scene.clean .scene-stamp { display: none; }

.mask { position: absolute; inset: 0; z-index: 3; pointer-events: none; transition: opacity .2s ease; }
.mask.is-hidden { opacity: 0; }
.mask > span {
  position: absolute; border-radius: 6px;
  background: color-mix(in oklab, var(--bad) 34%, transparent);
  border: 1px solid color-mix(in oklab, var(--bad) 55%, transparent);
  box-shadow: inset 0 0 26px color-mix(in oklab, var(--bad) 30%, transparent);
  backdrop-filter: blur(1px);
}

.rbox {
  position: absolute; z-index: 5; display: flex; align-items: flex-start; padding: 4px;
  border: 1px dashed color-mix(in oklab, var(--accent) 72%, transparent);
  border-radius: 4px; background: transparent; cursor: pointer;
  transition: opacity .18s ease, border-color .18s ease, background .18s ease;
}
.rbox:hover { background: rgb(255 255 255 / .06); }
.rbox > span {
  padding: 1px 5px; border-radius: 3px; background: rgb(0 0 0 / .55);
  color: #f0f0ed; font-size: 9.5px; line-height: 1.5; white-space: nowrap;
}
.rbox.is-off { opacity: .38; border-color: rgb(255 255 255 / .35); border-style: solid; }
.rbox.is-stale { opacity: .45; }

.scan { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; overflow: hidden; background: rgb(0 0 0 / .12); }
.scan::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  box-shadow: 0 0 26px 8px color-mix(in oklab, var(--accent) 30%, transparent);
  animation: scanline 1.5s ease-in-out infinite alternate;
}
@keyframes scanline { from { transform: translateY(8vh); } to { transform: translateY(56vh); } }
.scan-label {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px;
  background: rgb(15 15 17 / .82); border: 1px solid rgb(255 255 255 / .14);
  font-size: 12.5px; color: #f1f1ef; backdrop-filter: blur(12px);
}
.busy-chip {
  position: absolute; left: 50%; bottom: 56px; z-index: 6; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 999px;
  background: rgb(15 15 17 / .82); border: 1px solid rgb(255 255 255 / .14);
  font-size: 12px; color: #f1f1ef; backdrop-filter: blur(12px); white-space: nowrap;
}

.compare {
  position: absolute; inset: 0; z-index: 4; overflow: hidden; cursor: ew-resize; touch-action: pan-y;
  --split: 56%;
}
.compare .layer { position: absolute; inset: 0; }
.compare .after { clip-path: inset(0 0 0 var(--split)); }
.compare .handle {
  position: absolute; top: 0; bottom: 0; left: var(--split); width: 2px;
  background: rgb(255 255 255 / .88); transform: translateX(-1px); pointer-events: none;
  box-shadow: 0 0 20px rgb(0 0 0 / .55);
}
.compare .handle i {
  position: absolute; top: 50%; left: 50%; display: grid; place-items: center;
  width: 34px; height: 34px; border-radius: 50%; transform: translate(-50%, -50%);
  background: rgb(12 12 13 / .72); border: 1px solid rgb(255 255 255 / .55);
  color: #fff; font-size: 12px; font-style: normal; backdrop-filter: blur(8px);
}
.cmp-tag {
  position: absolute; top: 52px; z-index: 2; padding: 3px 9px; border-radius: 999px;
  background: rgb(0 0 0 / .5); color: #f0f0ed; font-size: 10.5px;
  border: 1px solid rgb(255 255 255 / .12); pointer-events: none;
}
.cmp-tag.left { left: 12px; }
.cmp-tag.right { right: 12px; }

.drop-hint {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 14px;
  border: 1px dashed var(--line-2); border-radius: var(--r2); background: var(--surface);
  color: var(--muted); font-size: 12px; text-align: left; transition: border-color .18s ease, background .18s ease;
}
.drop-hint:hover { border-color: color-mix(in oklab, var(--accent) 55%, var(--line-2)); background: color-mix(in oklab, var(--accent) 5%, var(--surface)); color: var(--fg-2); }
.drop-hint .ico { width: 17px; height: 17px; color: var(--accent); }
.drop-hint b { font-weight: 500; color: var(--fg-2); }

/* ---------- 单图侧栏 ---------- */
.thr { display: grid; gap: 7px; }
.thr-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--fg-2); }
.thr-head label { font-weight: 500; }
.thr-head output { font-size: 16px; font-weight: 600; color: var(--fg); letter-spacing: -.01em; }
input[type="range"] { width: 100%; height: 20px; margin: 0; background: transparent; accent-color: var(--accent); cursor: pointer; }
input[type="range"]:disabled { opacity: .45; cursor: default; }
.thr-scale { display: flex; justify-content: space-between; gap: 8px; font-size: 10.5px; color: var(--muted); }

.region-list { display: grid; gap: 6px; }
.region {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border: 1px solid var(--line); border-radius: var(--r2); background: var(--sunken);
  font-size: 12.5px; cursor: pointer; transition: border-color .16s ease, opacity .16s ease;
}
.region:hover { border-color: var(--line-2); }
.region input { width: 14px; height: 14px; margin: 0; accent-color: var(--accent); flex: none; }
.region-main { display: grid; gap: 1px; min-width: 0; flex: 1; }
.region-main b { font-weight: 500; color: var(--fg-2); }
.region-main small { font-size: 10.5px; color: var(--muted); }
.region-score { font-size: 12px; color: var(--muted); }
.region.is-below { opacity: .55; }
.region-note { padding: 0 2px; font-size: 10.5px; line-height: 1.55; color: var(--muted); }

.switch-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 11px;
  border: 1px solid var(--line); border-radius: var(--r2); background: var(--sunken); cursor: pointer;
}
.switch-copy { display: grid; gap: 1px; min-width: 0; flex: 1; font-size: 12.5px; }
.switch-copy b { font-weight: 500; color: var(--fg-2); }
.switch-copy small { font-size: 10.5px; color: var(--muted); }
.switch-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch { position: relative; width: 34px; height: 20px; flex: none; border-radius: 999px; background: var(--line-2); transition: background .18s ease; }
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #d6d6d2; transition: transform .18s ease, background .18s ease;
}
.switch-row input:checked + .switch { background: var(--accent); }
.switch-row input:checked + .switch::after { transform: translateX(14px); background: #111; }
.switch-row input:focus-visible + .switch { outline: 2px solid var(--accent); outline-offset: 2px; }

.status-line { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--fg-2); }
.prog-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.prog-head b { font-size: 19px; font-weight: 600; color: var(--fg); letter-spacing: -.02em; }
.prog-sub { font-size: 11.5px; color: var(--muted); }
.prog-block { display: grid; gap: 7px; }

.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.step { position: relative; display: grid; gap: 5px; font-size: 10.5px; color: var(--muted); }
.step::before { content: ""; height: 3px; border-radius: 3px; background: var(--line); }
.step.is-done::before { background: color-mix(in oklab, var(--accent) 55%, var(--line)); }
.step.is-active::before { background: var(--accent); }
.step.is-active { color: var(--fg-2); }
.step.is-done { color: var(--fg-2); }
.steps.all-done .step::before { background: var(--ok); }

.done-line { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--r2); background: color-mix(in oklab, var(--ok) 8%, var(--sunken)); border: 1px solid color-mix(in oklab, var(--ok) 28%, transparent); }
.ok-ring { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 50%; background: color-mix(in oklab, var(--ok) 18%, transparent); color: var(--ok); }
.ok-ring .ico { width: 15px; height: 15px; }
.done-line > div { display: grid; gap: 1px; min-width: 0; }
.done-line b { font-size: 13px; font-weight: 600; }
.done-line small { font-size: 11px; color: var(--muted); }

.field-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 12px; }
.field-line span { color: var(--muted); }
.field-line b { font-weight: 500; color: var(--fg-2); overflow-wrap: anywhere; text-align: right; }
.field { display: grid; gap: 6px; font-size: 12px; }
.field > span, .field > label { color: var(--muted); }
.input {
  width: 100%; min-width: 0; height: 34px; padding: 0 10px;
  border: 1px solid var(--line-2); border-radius: var(--r2); background: var(--sunken);
  color: var(--fg); font-size: 13px;
}
.input:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.input:disabled { opacity: .5; }
select.input { appearance: auto; }
.save-note { display: flex; align-items: flex-start; gap: 7px; font-size: 11px; line-height: 1.5; color: var(--muted); }
.save-note .ico { width: 14px; height: 14px; margin-top: 1px; color: var(--muted); }

/* ---------- 批次 ---------- */
.meta-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 13px 18px; }
.meta { min-width: 0; }
.meta dt { font-size: 10.5px; letter-spacing: .02em; color: var(--muted); }
.meta dd { margin-top: 3px; font-size: 13px; color: var(--fg-2); overflow-wrap: anywhere; }
.meta dd b { font-weight: 600; color: var(--fg); }
.meta dd .muted { color: var(--muted); font-weight: 400; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--sunken); }
.stat b { font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.stat span { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); }
.dot.warn { background: var(--warn); }
.dot.bad { background: var(--bad); }
.dot.accent { background: var(--accent); }

.callout {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--r2); background: var(--sunken);
}
.callout.warn { border-color: color-mix(in oklab, var(--warn) 34%, transparent); background: color-mix(in oklab, var(--warn) 7%, var(--sunken)); }
.callout.ok { border-color: color-mix(in oklab, var(--ok) 30%, transparent); background: color-mix(in oklab, var(--ok) 6%, var(--sunken)); }
.callout.bad { border-color: color-mix(in oklab, var(--bad) 34%, transparent); background: color-mix(in oklab, var(--bad) 7%, var(--sunken)); }
.callout-main { display: grid; gap: 2px; min-width: 0; flex: 1; }
.callout-main b { font-size: 13.5px; font-weight: 600; }
.callout-main small { font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.callout > .btn { margin-left: auto; }
.callout-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-left: auto; }
.callout-actions .btn { margin-left: 0; }

.overview-foot {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding-top: 12px; border-top: 1px solid var(--line);
}
.overview-foot .hint { max-width: 68ch; }

.thumb {
  position: relative; width: 52px; height: 52px; flex: none; overflow: hidden;
  border: 1px solid var(--line); border-radius: 9px;
  background: linear-gradient(145deg, var(--a, #6f8493), var(--b, #2c343c));
}
.thumb::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 72% 12%, rgb(255 255 255 / .22), transparent 55%); }
.thumb::after {
  content: "©"; position: absolute; right: 5px; bottom: 2px;
  color: rgb(255 255 255 / .34); font-size: 10px; letter-spacing: .04em;
}
.thumb.lg { width: 44px; height: 44px; border-radius: 8px; }
.thumb.xs { width: 34px; height: 34px; border-radius: 7px; }

.items { display: grid; }
.item {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) 88px 104px 96px;
  gap: 14px; align-items: center; padding: 12px 18px;
  border-bottom: 1px solid var(--line); transition: background .16s ease;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: color-mix(in oklab, var(--accent) 3%, transparent); }
.item-main { display: grid; gap: 2px; min-width: 0; }
.item-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; font-weight: 500; }
.item-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.item-sub .sep { opacity: .45; }
.item-error { font-size: 11.5px; color: var(--bad); overflow-wrap: anywhere; }
.sub-status { display: none; font-weight: 600; }
.item-conf { display: grid; justify-items: end; gap: 1px; }
.item-conf b { font-size: 12.5px; font-weight: 500; color: var(--fg-2); }
.item-conf small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.item-state { display: flex; justify-content: flex-end; }
.item-act { display: flex; justify-content: flex-end; }
.empty { padding: 26px 18px; text-align: center; font-size: 12.5px; color: var(--muted); }

.log { display: grid; margin: 0; padding: 4px 0; list-style: none; }
.log li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 8px 18px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-2); }
.log li:last-child { border-bottom: 0; }
.log li time { font-size: 10.5px; color: var(--muted); }
.log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); align-self: center; }
.log-dot.ok { background: var(--ok); }
.log-dot.bad { background: var(--bad); }
.log-dot.warn { background: var(--warn); }
.log-dot.accent { background: var(--accent); }
.log-dot.muted { background: var(--muted); }

/* ---------- 弹层 ---------- */
.modal-layer { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; }
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .58); backdrop-filter: blur(5px); }
.modal {
  position: relative; display: flex; flex-direction: column; width: min(520px, 100%);
  max-height: min(86dvh, 900px); overflow: hidden;
  border: 1px solid var(--line-2); border-radius: calc(var(--r3) + 2px);
  background: var(--raised); box-shadow: 0 40px 80px -24px rgb(0 0 0 / .72);
  animation: modal-in .18s ease;
}
.modal.wide { width: min(640px, 100%); }
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 0; }
.modal-head > div { min-width: 0; flex: 1; }
.modal-head h2 { font-size: 17px; font-weight: 600; line-height: 1.3; }
.modal-head p { margin-top: 4px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }
.icon-btn {
  display: grid; place-items: center; width: 30px; height: 30px; margin: -4px -6px 0 0;
  border-radius: var(--r2); color: var(--fg-2); flex: none;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--fg); }
.modal-body { display: grid; gap: 16px; padding: 16px 22px 6px; overflow-y: auto; }
.modal-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }
.modal-body .meta-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.review-compare { position: relative; height: 240px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--r2); background: #0b0c0e; }
.note {
  padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r2);
  background: var(--sunken); font-size: 11.5px; line-height: 1.55; color: var(--muted);

.note b { color: var(--fg-2); font-weight: 500; }

/* ---------- 新建批次 ---------- */
.pick-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.pick-head span { font-size: 12px; color: var(--muted); }
.pick-head b { color: var(--fg-2); font-weight: 500; }
.pick-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick {
  position: relative; aspect-ratio: 1.25; overflow: hidden; border: 1px solid var(--line);
  border-radius: 8px; background: linear-gradient(145deg, var(--a), var(--b));
  transition: border-color .16s ease, box-shadow .16s ease;
}
.pick::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 70% 10%, rgb(255 255 255 / .2), transparent 55%); }
.pick::after { content: "©"; position: absolute; right: 5px; bottom: 3px; font-size: 9px; color: rgb(255 255 255 / .32); }
.pick[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pick .pick-name { position: absolute; left: 4px; right: 4px; bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; color: rgb(255 255 255 / .82); text-shadow: 0 1px 4px rgb(0 0 0 / .6); }
.pick .tick {
  position: absolute; top: 5px; right: 5px; display: grid; place-items: center;
  width: 17px; height: 17px; border-radius: 50%; background: rgb(0 0 0 / .5);
  border: 1px solid rgb(255 255 255 / .35); color: transparent;

.pick[aria-pressed="true"] .tick { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
.pick .tick .ico { width: 11px; height: 11px; }
.field-block { display: grid; gap: 8px; }
.field-block > label, .field-block > .field-label { font-size: 12px; font-weight: 500; color: var(--fg-2); }
.field-block .thr-head { font-size: 12px; }

/* ---------- Toast ---------- */
#toast-root {
  position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); z-index: 100;
  display: grid; gap: 8px; width: min(390px, calc(100% - 28px)); transform: translateX(-50%); pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px;
  border: 1px solid var(--line-2); border-radius: 12px; background: var(--raised);
  box-shadow: 0 18px 44px -18px rgb(0 0 0 / .8); font-size: 12.5px; line-height: 1.5; color: var(--fg-2);
  animation: toast-in .2s ease;
}
.toast .ico { margin-top: 1px; }
.toast.ok .ico { color: var(--ok); }
.toast.warn .ico { color: var(--warn); }
.toast.bad .ico { color: var(--bad); }
.toast.accent .ico { color: var(--accent); }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 响应式 ---------- */
@media (max-width: 1023px) {

  .brand-word small { display: none; }

  .rail-label, .rail-card, .rail-note { display: none; }
  .nav { display: flex; gap: 3px; }
  .nav-item { height: 34px; padding: 0 10px; font-size: 12.5px; gap: 6px; }
  .nav-item .ico { width: 15px; height: 15px; }
  .nav-label .lg { display: none; }
  .nav-label .sm { display: inline; }

  .page { padding: 24px 18px 76px; }
  .title-line h1 { font-size: 27px; }
  .single-layout { grid-template-columns: minmax(0, 1fr); }
  .single-side { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .single-side > .card:first-child { grid-column: 1 / -1; }
  .stage { height: min(56vh, 520px); min-height: 340px; }
  .meta-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .item { grid-template-columns: 48px minmax(0, 1fr) 100px 92px; gap: 12px; }
  .item-conf { display: none; }
  .sub-status { display: inline; }
}

@media (max-width: 759px) {
  .page { padding: 18px 14px 72px; }
  .page-head { gap: 13px; margin-bottom: 18px; }

  .page-desc { font-size: 12.5px; }
  .page-actions { width: 100%; }

  .single-side { grid-template-columns: minmax(0, 1fr); }

  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  .item-name { font-size: 13px; }
  .item-sub { font-size: 10.5px; }

}

@media (max-width: 389px) {
  .brand-word { display: none; }
  .nav-item { padding: 0 8px; }
  .page-actions .btn { flex: 1 1 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

  /* =========================================================

  function icon(name, cls) {
    return '<svg class="ico' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function nowTime() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, '0');
    var m = String(d.getMinutes()).padStart(2, '0');
    return h + ':' + m;
  }

  function outName(name) {
    return name.replace(/\.[^.]+$/, '') + ' - 已修复.png';
  }

  function fmtDuration(seconds) {
    var s = Math.max(0, Math.round(seconds));
    if (s < 60) return s + ' 秒';
    var m = Math.floor(s / 60);
    var rest = s % 60;
    return m + ' 分' + (rest ? ' ' + rest + ' 秒' : '');
  }

  function activeRegions() {
    var s = state.single;
    return s.regions.filter(function (region) {
      return region.on && Math.round(region.score * 255) >= s.threshold;
    });
  }

  function tally(items) {
    var t = { saved: 0, review: 0, pending: 0, working: 0, no_detection: 0, failed: 0, skipped: 0, cancelled: 0 };
    items.forEach(function (item) {
      if (item.status === 'saved') t.saved++;
      else if (item.status === 'review') t.review++;
      else if (item.status === 'pending') t.pending++;
      else if (item.status === 'generating' || item.status === 'saving') t.working++;
      else if (item.status === 'no_detection') t.no_detection++;
      else if (item.status === 'failed') t.failed++;
      else if (item.status === 'skipped') t.skipped++;
      else if (item.status === 'cancelled') t.cancelled++;
    });
    return t;
  }

  function progressOf(batch) {
    var t = tally(batch.items);
    var processed = t.saved + t.skipped + t.no_detection + t.failed + t.cancelled;
    var total = batch.items.length || 1;
    return { done: processed, total: batch.items.length, pct: Math.round((processed / total) * 100) };
  }

  var ITEM_STATUS = {
    pending: ['排队中', 'muted'],
    generating: ['检测中', 'accent'],
    review: ['待审核', 'warn'],
    saving: ['保存中', 'accent'],
    saved: ['已保存', 'ok'],
    skipped: ['已跳过', 'muted'],
    no_detection: ['未检出', 'muted'],
    failed: ['失败', 'bad'],
    cancelled: ['已取消', 'muted']
  };

  function statusPill(status, live) {
    var meta = ITEM_STATUS[status] || ['未知', 'muted'];
    return '<span class="pill ' + meta[1] + '">' + (live ? '<i class="live" style="--tone:currentColor"></i>' : '') + meta[0] + '</span>';
  }

  function batchStatusPill(batch) {
    if (batch.status === 'running') {
      if (batch.mode === 'review' && batch.items.some(function (item) { return item.status === 'review'; })) {
        return '<span class="pill warn">等待审核</span>';
      }
      return '<span class="pill ok"><i class="live"></i>运行中</span>';
    }
    if (batch.status === 'paused') return '<span class="pill warn">已暂停</span>';
    if (batch.status === 'cancelled') return '<span class="pill muted">已取消</span>';
    return '<span class="pill ok">已完成</span>';
  }

  function toast(text, tone) {
    var root = document.getElementById('toast-root');
    if (!root) return;
    var item = document.createElement('div');
    item.className = 'toast ' + (tone || 'accent');
    item.innerHTML = icon(tone === 'ok' ? 'check' : tone === 'bad' || tone === 'warn' ? 'alert' : 'info') + '<span>' + esc(text) + '</span>';
    root.appendChild(item);
    var id = ++toastSeq;
    item.dataset.id = String(id);
    window.setTimeout(function () {
      item.classList.add('out');
      window.setTimeout(function () {
        if (item.parentNode) item.parentNode.removeChild(item);
      }, 220);
    }, 3000);
  }

  function stageMarkup() {

          ' data-action="toggle-region" data-id="' + region.id + '" aria-pressed="' + on + '"' +
          ' title="' + esc(region.label) + ' · 检测分数 ' + region.score.toFixed(2) + '">' +
          '<span>' + esc(region.label) + ' · ' + region.score.toFixed(2) + '</span>' +
        '</button>';
      }).join('');
    }

    var mask = '';
    var maskVisible = s.showMask && (s.phase === 'detected' || s.phase === 'stale' || s.phase === 'repairing');
    if (maskVisible) {
      mask = '<div class="mask">' + s.regions.filter(function (region) {
        return region.on && Math.round(region.score * 255) >= s.threshold;
      }).map(function (region) {
        return '<span style="left:' + region.left + '%;top:' + region.top + '%;width:' + region.width + '%;height:' + region.height + '%"></span>';
      }).join('') + '</div>';
    }

    var overlay = '';

      overlay = '<div class="scan"><span class="scan-label"><i class="spinner"></i>正在分析水印概率…</span></div>';

    } else if (s.phase === 'empty') {
      overlay = '<div class="busy-chip">' + icon('info') + '当前阈值下没有区域超过阈值</div>';
